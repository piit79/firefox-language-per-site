name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the changelog

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest version
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "v$manifest_version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..$TAG"
            echo "## Changes since $prev" > notes.md
          else
            range="$TAG"
            echo "## Changes" > notes.md
          fi
          echo >> notes.md
          git log --no-merges --pretty='- %s (%h)' "$range" >> notes.md
          cat notes.md

      - name: Submit to addons.mozilla.org
        # v1.0.0 was submitted by hand on the AMO website; AMO rejects a version it already has.
        if: github.ref_name != 'v1.0.0'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: >
          npx --yes web-ext@8 sign
          --channel=listed
          --approval-timeout=0
          --source-dir .
          --artifacts-dir amo-artifacts
          --ignore-files 'test/**' 'amo/**' package.json README.md notes.md 'web-ext-artifacts/**'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            web-ext-artifacts/*.zip
